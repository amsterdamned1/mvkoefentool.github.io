<style>

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}

  .mono{font-family:'IBM Plex Mono',monospace;}
  .disp{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:600;line-height:1.05;}
  .knop{width:100%;padding:13px 20px;font-family:'Barlow Condensed',sans-serif;font-size:18px;
    font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;}
  .k-primair{background:var(--ink);color:#fff;border:2px solid var(--ink);}
  .k-rand{background:transparent;color:var(--ink);border:2px solid var(--ink);}
  .k-stil{background:transparent;color:var(--soft);border:2px solid transparent;}
  .k-goed{background:var(--green);color:#fff;border:2px solid var(--green);}
  .k-fout{background:var(--red);color:#fff;border:2px solid var(--red);}
  .k-uit{opacity:.4;cursor:default;}
  .deckknop{display:block;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);padding:16px 18px;}
  .optie{text-align:left;background:var(--card);border:1.5px solid var(--line);color:var(--ink);
    padding:13px 15px;font-size:15px;line-height:1.4;display:flex;gap:11px;width:100%;
    font-family:'IBM Plex Sans',sans-serif;}
  .optie[disabled]{cursor:default;}
  .band{height:14px;background:#D2D6D7;border:1px solid var(--line);overflow:hidden;}
  .band > i{display:block;height:100%;width:0;
    background-image:repeating-linear-gradient(-45deg,var(--yellow) 0 10px,var(--ink) 10px 20px);
    transition:width 340ms cubic-bezier(.2,.8,.2,1);}
  .link{background:none;border:none;color:var(--soft);font-size:13px;text-decoration:underline;
    font-family:'IBM Plex Sans',sans-serif;padding:0;}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}

var SLEUTEL = "mvk:leitner:v1";
var boxes = {};

function laadBoxes(){
  try {
    var ruw = window.localStorage.getItem(SLEUTEL);
    boxes = ruw ? JSON.parse(ruw) : {};
    if (typeof boxes !== "object" || boxes === null) boxes = {};
  } catch (e) { boxes = {}; }
}
function bewaarBoxes(){
  try { window.localStorage.setItem(SLEUTEL, JSON.stringify(boxes)); } catch (e) {}
}
function noteer(id, goed){
  var huidig = boxes[id] || 0;
  boxes[id] = goed ? Math.min(3, huidig + 1) : 1;
  bewaarBoxes();
}
function wisVoortgang(){
  boxes = {};
  try { window.localStorage.removeItem(SLEUTEL); } catch (e) {}
  render();
}

/* ------------------------- helpers ------------------------- */
function el(tag, attrs){
  var n = document.createElement(tag);
  if (attrs) {
    for (var k in attrs) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k === "style") n.setAttribute("style", attrs[k]);
      else if (k === "onclick") n.addEventListener("click", attrs[k]);
      else if (attrs[k] === true) n.setAttribute(k, "");
      else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k]);
    }
  }
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c == null || c === false) continue;
    if (Array.isArray(c)) { for (var j = 0; j < c.length; j++) if (c[j]) n.appendChild(c[j]); }
    else if (typeof c === "string") n.appendChild(document.createTextNode(c));
    else n.appendChild(c);
  }
  return n;
}
function knop(label, klasse, fn, uit){
  return el("button", {
    class: "knop " + klasse + (uit ? " k-uit" : ""),
    onclick: uit ? function(){} : fn,
    disabled: uit ? true : false,
    text: label
  });
}
function schud(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pad(n){ return (n < 10 ? "0" : "") + n; }

/* ------------------------- state ------------------------- */
var S = { scherm:"start", set:[], titel:"", i:0, gekozen:null, onthuld:false, fouten:[], goed:0, res:null };

function startRonde(vragen, naam){
  if (!vragen.length) return;
  S.scherm = "ronde"; S.set = schud(vragen); S.titel = naam;
  S.i = 0; S.gekozen = null; S.onthuld = false; S.fouten = []; S.goed = 0;
  render();
}
function volgende(was){
  var v = S.set[S.i];
  noteer(v.id, was);
  if (was) S.goed++; else S.fouten.push(v);
  if (S.i + 1 >= S.set.length) {
    S.res = { goed:S.goed, fouten:S.fouten.slice(), totaal:S.set.length };
    S.scherm = "einde";
  } else {
    S.i++; S.gekozen = null; S.onthuld = false;
  }
  render();
}

/* ------------------------- schermen ------------------------- */
function schermStart(){
  var wrap = el("div");

  var kop = el("div", { style:"padding:28px 20px 22px" });
  kop.appendChild(el("div", { class:"eyebrow", text:"MVK · Actieve terugroeping" }));
  var h1 = el("h1", { class:"disp",
    style:"font-size:46px;line-height:.92;font-weight:700;margin:10px 0 0;letter-spacing:-.01em" });
  h1.appendChild(document.createTextNode("Oefentool"));
  h1.appendChild(el("br"));
  h1.appendChild(document.createTextNode("drie documenten"));
  kop.appendChild(h1);
  kop.appendChild(el("p", { style:"font-size:14.5px;line-height:1.55;color:var(--soft);margin:14px 0 0;max-width:460px",
    text:"Elke vraag klimt bij een goed antwoord één vakje omhoog en valt bij een fout antwoord terug naar vakje 1. Wat u fout doet, komt vanzelf vaker terug." }));

  var beheerst = VRAGEN.filter(function(v){ return (boxes[v.id] || 0) >= 3; }).length;
  var teller = el("div", { style:"margin-top:16px;display:flex;align-items:baseline;gap:10px" });
  var getal = el("span", { class:"mono", style:"font-size:30px;font-weight:600" });
  getal.appendChild(document.createTextNode(String(beheerst)));
  getal.appendChild(el("span", { style:"color:var(--line)", text:"/" + VRAGEN.length }));
  teller.appendChild(getal);
  teller.appendChild(el("div", { class:"eyebrow", text:"beheerst" }));
  kop.appendChild(teller);
  wrap.appendChild(kop);

  var lijst = el("div", { style:"padding:0 20px 20px;display:grid;gap:10px" });
  Object.keys(DECKS).forEach(function(k){
    var d = DECKS[k];
    var vs = VRAGEN.filter(function(v){ return v.deck === k; });
    var ok = vs.filter(function(v){ return (boxes[v.id] || 0) >= 3; }).length;

    var b = el("button", { class:"deckknop", style:"border-left:8px solid " + d.kleur,
      onclick: function(){ startRonde(vs, d.naam); } });
    var rij = el("div", { style:"display:flex;justify-content:space-between;align-items:flex-start;gap:12px" });
    var links = el("div");
    links.appendChild(el("div", { class:"eyebrow", text:d.code }));
    links.appendChild(el("div", { class:"disp", style:"font-size:25px;margin-top:4px", text:d.naam }));
    links.appendChild(el("div", { style:"font-size:13px;color:var(--soft);margin-top:3px", text:d.sub }));
    rij.appendChild(links);
    rij.appendChild(el("div", { class:"mono",
      style:"font-size:13px;color:var(--soft);white-space:nowrap;padding-top:14px",
      text: ok + "/" + vs.length }));
    b.appendChild(rij);
    var balk = el("div", { style:"margin-top:12px;height:4px;background:#E4E7E7" });
    balk.appendChild(el("div", { style:"height:100%;transition:width 300ms;width:" + (ok / vs.length * 100) + "%;background:" + d.kleur }));
    b.appendChild(balk);
    lijst.appendChild(b);
  });
  wrap.appendChild(lijst);

  var zwak = VRAGEN.filter(function(v){ var b = boxes[v.id] || 0; return b > 0 && b < 3; });
  var acties = el("div", { style:"padding:0 20px 40px;display:grid;gap:10px" });
  acties.appendChild(knop("Examenronde · 20 vragen door elkaar", "k-primair", function(){
    startRonde(schud(VRAGEN).slice(0, 20), "Examenronde");
  }));
  acties.appendChild(knop(
    zwak.length ? "Zwakke punten herhalen · " + zwak.length : "Zwakke punten · nog geen",
    "k-rand",
    function(){ startRonde(zwak, "Zwakke punten"); },
    zwak.length === 0
  ));
  if (beheerst > 0 || Object.keys(boxes).length > 0) {
    acties.appendChild(knop("Voortgang wissen", "k-stil", function(){
      if (window.confirm("Alle voortgang wissen? Dit kan niet ongedaan worden gemaakt.")) wisVoortgang();
    }));
  }
  wrap.appendChild(acties);
  return wrap;
}

function schermRonde(){
  var v = S.set[S.i];
  var d = DECKS[v.deck];
  var box = boxes[v.id] || 0;
  var af = (S.gekozen !== null || S.onthuld);
  var pct = ((S.i + (af ? 1 : 0)) / S.set.length) * 100;

  var wrap = el("div");

  var band = el("div", { class:"band" });
  var vul = el("i");
  band.appendChild(vul);
  wrap.appendChild(band);
  requestAnimationFrame(function(){ vul.style.width = pct + "%"; });

  var top = el("div", { style:"padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:12px" });
  top.appendChild(el("div", { class:"eyebrow",
    style:"color:" + (d.kleur === "#F5C400" ? "#9A7B00" : d.kleur),
    text: d.code + " · " + d.naam }));
  var rechts = el("div", { style:"display:flex;align-items:center;gap:14px" });
  var vakjes = el("div", { style:"display:flex;gap:3px", title:"Vakje " + box + " van 3" });
  for (var n = 1; n <= 3; n++) {
    vakjes.appendChild(el("div", { style:"width:7px;height:7px;border:1.5px solid var(--soft);background:" + (box >= n ? "var(--ink)" : "transparent") }));
  }
  rechts.appendChild(vakjes);
  rechts.appendChild(el("span", { class:"mono", style:"font-size:12px;color:var(--soft)",
    text: pad(S.i + 1) + "/" + pad(S.set.length) }));
  top.appendChild(rechts);
  wrap.appendChild(top);

  var body = el("div", { style:"padding:14px 20px 26px" });
  body.appendChild(el("h2", { style:"font-size:20px;line-height:1.35;font-weight:600;margin:0 0 20px", text:v.v }));

  if (v.type === "mc") {
    var opts = el("div", { style:"display:grid;gap:8px" });
    v.opties.forEach(function(o, idx){
      var bg = "var(--card)", br = "var(--line)", kl = "var(--ink)";
      if (S.gekozen !== null) {
        if (idx === v.juist) { bg = "#E8F5EC"; br = "var(--green)"; }
        else if (idx === S.gekozen) { bg = "#FBEAED"; br = "var(--red)"; }
        else { kl = "var(--soft)"; }
      }
      var b = el("button", { class:"optie",
        style:"background:" + bg + ";border-color:" + br + ";color:" + kl,
        disabled: S.gekozen !== null,
        onclick: function(){ if (S.gekozen === null) { S.gekozen = idx; render(); } } });
      b.appendChild(el("span", { class:"mono", style:"font-size:12px;color:var(--soft);padding-top:2px",
        text: String.fromCharCode(97 + idx) }));
      b.appendChild(el("span", { text:o }));
      opts.appendChild(b);
    });
    body.appendChild(opts);
  }

  if (v.type === "recall" && !S.onthuld) {
    body.appendChild(el("div", {
      style:"border:1.5px dashed var(--line);padding:26px 18px;text-align:center;color:var(--soft);font-size:14px;line-height:1.5;background:var(--card)",
      text:"Formuleer eerst hardop of op papier uw antwoord. Pas daarna onthullen." }));
    var w1 = el("div", { style:"margin-top:12px" });
    w1.appendChild(knop("Antwoord tonen", "k-primair", function(){ S.onthuld = true; render(); }));
    body.appendChild(w1);
  }

  if (v.type === "recall" && S.onthuld) {
    var kaart = el("div", { style:"background:var(--card);border:1px solid var(--line);border-left:6px solid var(--green);padding:16px 18px" });
    kaart.appendChild(el("div", { class:"eyebrow", style:"color:var(--green)", text:"Modelantwoord" }));
    kaart.appendChild(el("p", { style:"margin:9px 0 0;font-size:15.5px;line-height:1.55", text:v.antwoord }));
    body.appendChild(kaart);
  }

  if (af && v.uitleg) {
    var u = el("div", { style:"margin-top:14px;padding:13px 16px;background:#DCE0E1;border-left:4px solid var(--blue)" });
    u.appendChild(el("div", { class:"eyebrow", style:"color:var(--blue)", text:"Toelichting" }));
    u.appendChild(el("p", { style:"margin:7px 0 0;font-size:14px;line-height:1.5", text:v.uitleg }));
    body.appendChild(u);
  }

  if (S.gekozen !== null) {
    var w2 = el("div", { style:"margin-top:18px" });
    w2.appendChild(knop(S.i + 1 >= S.set.length ? "Ronde afsluiten" : "Volgende vraag", "k-primair",
      function(){ volgende(S.gekozen === v.juist); }));
    body.appendChild(w2);
  }

  if (S.onthuld) {
    var w3 = el("div", { style:"margin-top:18px" });
    w3.appendChild(el("div", { class:"eyebrow", text:"Beoordeel uzelf eerlijk" }));
    var paar = el("div", { style:"display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px" });
    paar.appendChild(knop("Wist ik niet", "k-fout", function(){ volgende(false); }));
    paar.appendChild(knop("Wist ik", "k-goed", function(){ volgende(true); }));
    w3.appendChild(paar);
    body.appendChild(w3);
  }

  var af2 = el("div", { style:"margin-top:26px;text-align:center" });
  af2.appendChild(el("button", { class:"link", text:"Ronde afbreken",
    onclick: function(){ S.scherm = "start"; render(); } }));
  body.appendChild(af2);

  wrap.appendChild(body);
  return wrap;
}

function schermEinde(){
  var r = S.res;
  var pct = Math.round(r.goed / r.totaal * 100);
  var kleur = pct >= 80 ? "var(--green)" : pct >= 55 ? "var(--yellow)" : "var(--red)";

  var wrap = el("div", { style:"padding:30px 20px 40px" });
  wrap.appendChild(el("div", { class:"eyebrow", text:S.titel + " · afgerond" }));
  var score = el("div", { style:"display:flex;align-items:baseline;gap:12px;margin-top:12px" });
  score.appendChild(el("span", { class:"disp",
    style:"font-size:78px;font-weight:700;line-height:.85;color:" + kleur, text:pct + "%" }));
  score.appendChild(el("span", { class:"mono", style:"font-size:14px;color:var(--soft)",
    text: r.goed + " van " + r.totaal }));
  wrap.appendChild(score);

  if (r.fouten.length) {
    var blok = el("div", { style:"margin-top:26px" });
    blok.appendChild(el("div", { class:"eyebrow", style:"color:var(--red)", text:"Terug naar vakje 1" }));
    var lijst = el("div", { style:"margin-top:10px;display:grid;gap:7px" });
    r.fouten.forEach(function(f){
      var k = el("div", { style:"background:var(--card);border:1px solid var(--line);border-left:5px solid var(--red);padding:11px 14px" });
      k.appendChild(el("div", { style:"font-size:14px;line-height:1.4", text:f.v }));
      k.appendChild(el("div", { style:"font-size:12.5px;line-height:1.45;color:var(--soft);margin-top:5px",
        text: f.type === "mc" ? f.opties[f.juist] : f.antwoord }));
      lijst.appendChild(k);
    });
    blok.appendChild(lijst);
    wrap.appendChild(blok);
  } else {
    wrap.appendChild(el("p", { style:"font-size:15px;line-height:1.55;color:var(--soft);margin-top:20px",
      text:"Alles goed. Kom over drie dagen terug — dan meet u wat er werkelijk is blijven zitten." }));
  }

  var acties = el("div", { style:"margin-top:28px;display:grid;gap:10px" });
  if (r.fouten.length) {
    acties.appendChild(knop("Alleen de fouten opnieuw", "k-primair", function(){
      startRonde(r.fouten, S.titel);
    }));
  }
  acties.appendChild(knop("Terug naar overzicht", "k-rand", function(){ S.scherm = "start"; render(); }));
  wrap.appendChild(acties);
  return wrap;
}

/* ------------------------- render ------------------------- */
function render(){
  var app = document.getElementById("app");
  app.textContent = "";
  var scherm = S.scherm === "ronde" ? schermRonde()
             : S.scherm === "einde" ? schermEinde()
             : schermStart();
  app.appendChild(scherm);
  try { window.scrollTo(0, 0); } catch (e) {}
}

laadBoxes();
render();
</script>
</body>
</html>
